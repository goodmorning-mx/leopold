name: Build firmware release

on:
  push:
    tags:
      - 'firmware-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    name: Build ESP32 firmware
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned image tooling for generation and regression checks
        run: python3 -m pip install -r scripts/requirements.txt
      - name: Generate and validate shared firmware output
        run: |
          python3 scripts/check_settings_overlay_generation.py
          python3 scripts/validate_shared_ui.py
          python3 scripts/validate_settings_renderer_parity.py
          python3 scripts/validate_calibration.py
          python3 scripts/sync_shared_assets.py
          python3 scripts/verify_shared_outputs.py
          python3 scripts/generate_firmware_ui.py
          python3 scripts/validate_firmware_config.py
          git diff --exit-code -- device frontend/public/firmware-assets frontend/src/shared shared

      - name: Build with the CI-identical pinned profile
        env:
          ARDUINO_CLI_VERSION: 1.2.2
        run: python3 scripts/build_firmware.py
      - name: Test flashing and packaging safety
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Package flashable firmware
        env:
          ARDUINO_CLI_VERSION: 1.2.2
        run: python3 scripts/package_firmware.py device/build firmware-release

      - name: Create archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: tar -czf "leopold-${RELEASE_TAG}-${COMMIT_SHA:0:12}.tar.gz" -C firmware-release .

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: leopold-firmware-${{ github.sha }}
          path: |
            firmware-release/
            leopold-*.tar.gz

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/firmware-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            firmware-release/* \
            leopold-*.tar.gz \
            --title "Leopold $GITHUB_REF_NAME" \
            --generate-notes
