name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  shared-ui:
    name: Shared UI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_shared_ui.py
      - run: python3 scripts/sync_shared_assets.py
      - run: python3 scripts/verify_shared_outputs.py
      - run: git diff --exit-code -- device/assets frontend/public/firmware-assets frontend/src/shared

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest
      - run: alembic history --verbose

  docker:
    name: Docker build validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose build
      - run: docker compose up --build --wait
      - run: curl --fail http://127.0.0.1:8000/health
      - run: curl --fail http://127.0.0.1:8080/
      - if: always()
        run: docker compose down --volumes

  firmware:
    name: Firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate shared firmware output
        run: |
          python3 scripts/validate_shared_ui.py
          python3 scripts/sync_shared_assets.py
          python3 scripts/verify_shared_outputs.py
          python3 scripts/generate_firmware_ui.py
          python3 scripts/validate_firmware_config.py
          git diff --exit-code -- device frontend/public/firmware-assets frontend/src/shared shared
      - name: Build with pinned Arduino CLI profile
        env:
          ARDUINO_CLI_VERSION: 1.2.2
        run: python3 scripts/build_firmware.py
      - name: Package firmware artifact
        env:
          ARDUINO_CLI_VERSION: 1.2.2
        run: python3 scripts/package_firmware.py device/build firmware-release
      - uses: actions/upload-artifact@v4
        with:
          name: leopold-firmware-${{ github.sha }}
          path: firmware-release/
