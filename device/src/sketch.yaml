profiles:
  leopold:
    notes: >-
      Leopold Waveshare ESP32-S3 Touch AMOLED 1.43-B firmware. This profile is
      the only supported firmware compiler definition for CI and releases.
    fqbn: esp32:esp32:esp32s3:USBMode=default,CDCOnBoot=cdc,UploadMode=default,CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=custom,PSRAM=opi,LoopCore=1,EventsCore=1,EraseFlash=none,JTAGAdapter=default,ZigbeeMode=default
    platforms:
      - platform: esp32:esp32 (3.2.0)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - GFX Library for Arduino (1.6.7)
      - lvgl (9.3.0)
      - ArduinoJson (7.4.2)
      - WiFiManager (2.0.17)
      - QRCode (0.0.1)

default_profile: leopold
