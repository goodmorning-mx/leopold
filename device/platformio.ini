[platformio]
default_envs = leopold
boards_dir = ../boards

[env:leopold]
extra_scripts =
  pre:../scripts/generate_firmware_ui.py
  pre:../scripts/configure_firmware_ci.py
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = leopold_s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_upload.flash_size = 16MB
board_build.f_cpu = 240000000L
board_build.flash_freq = 80M
board_build.flash_mode = qio
board_build.partitions = src/partitions.csv
board_build.arduino.memory_type = qio_opi
build_flags =
  -Wall
  -Wextra
  -I include
  -I ../shared
  -D LV_CONF_INCLUDE_SIMPLE
  -D BOARD_HAS_PSRAM
  -D WM_NODEBUG
  -I ${platformio.libdeps_dir}/leopold/QRCode/src

lib_ignore = QRCode
build_src_filter = +<*.cpp> -<*.ino>

lib_deps =
  moononournation/GFX Library for Arduino@1.6.7
  lvgl/lvgl@9.3.0
  bblanchon/ArduinoJson@7.4.2
  tzapu/WiFiManager@2.0.17
  ricmoo/QRCode@0.0.1
