[platformio]
default_envs = leopold

[env:leopold]
extra_scripts = pre:../scripts/generate_firmware_ui.py
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_upload.flash_size = 16MB
board_build.f_cpu = 240000000L
board_build.flash_freq = 80M
board_build.flash_mode = qio
board_build.arduino.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.embed_files =
  assets/sky_flower.bin
  assets/sky_home.bin
  assets/icon_clock.bin
  assets/icon_bolt.bin
  assets/icon_weather.bin
  assets/icon_nav.bin
  assets/icon_spotify.bin
  assets/icon_spotify_large.bin

build_flags =
  -Wall
  -Wextra
  -I include
  -I ../shared
  -D LV_CONF_INCLUDE_SIMPLE
  -D BOARD_HAS_PSRAM
  -D WM_NODEBUG
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
  moononournation/GFX Library for Arduino@1.6.7
  lvgl/lvgl@9.3.0
  bblanchon/ArduinoJson@7.4.2
  tzapu/WiFiManager@2.0.17
  ricmoo/QRCode@0.0.1
